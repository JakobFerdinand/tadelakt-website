name: CI and deploy

on:
  push:
    # Nothing in these paths is linted, tested, built or exported.
    paths-ignore:
      - '**.md'
      - img/**
      - .github/dependabot.yml
  pull_request:
    paths-ignore:
      - '**.md'
      - img/**
      - .github/dependabot.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production upload halfway through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install FTP client for deployment regression tests
        run: sudo apt-get update && sudo apt-get install --yes lftp
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check formatting, lint, types, unit tests, build and browser tests
        run: npm run check
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save tested static export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: website
          path: out/
          include-hidden-files: true # Apache's .htaccess is required.
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Hetzner
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: hetzner-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: website
          path: out/
      - name: Install encrypted FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp
      - name: Check this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded main commit.'
          fi
      - name: Upload tested export and remove stale files over FTPS
        if: steps.latest.outputs.deploy == 'true'
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/deploy-ftps.mjs
